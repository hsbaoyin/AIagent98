; AIagent98 示例配置
; 复制为 AGENT98.INI（放在 exe 同目录）后修改下面的值。
; 也可以直接运行 AGENT98.EXE，在 Tools -> Settings... 里填写。

[api]
; 任意 OpenAI 兼容服务的地址，结尾不要带 /chat/completions
base=https://api.openai.com/v1
; API 密钥；Ollama 等本地服务可以留空
key=
model=gpt-4o-mini
; 1 = 流式输出，0 = 一次性返回
stream=1
max_tokens=1024
temperature=0.7
; 每行一个 Name: value，或用 | 分隔
; extra_headers=X-Title: AIagent98
; system_prompt=You are AIagent98...

[agent]
; 工具可以访问的目录，默认是 exe 同目录下的 workspace
workspace=C:\AGENT98\WORKSPACE
; 是否允许 run_command（执行 COMMAND.COM 命令）
allow_shell=0
; DANGER: full system access - disables the workspace sandbox and the shell command ban list.
; The model can then read/write any file and run any command. Only for a disposable VM.
full_access=0
; Auto-confirm every tool call (no dialog). Implied by full_access=1.
auto_confirm=0
; 是否允许访问 workspace 之外的路径
allow_outside=0
; 一次对话里最多几轮工具调用（0 = 不限，1~200）
max_steps=32
; Auto-compact old messages into a summary when context exceeds this many bytes.
; 0 = disabled. Default 24576 (about 6-8k tokens).
compact_threshold=24576
; Number of recent messages to keep verbatim after compaction (2-40).
compact_keep=6

[tls]
; 1 = 校验服务器证书（除非有特殊原因，否则保持 1）
verify=1

[log]
; 0=ERROR 1=WARN 2=INFO 3=DEBUG 4=TRACE
level=2

[emoji]
; 1 = 对话区把 emoji 画成素材里的 16x16 小图标；0 = 显示 :shortcode: 文本
; 默认 0：某些 Win95/98 上 RichEdit 插入图片对象会让程序崩溃
inline=0

[net]
; 1 = allow network tools (http_request/web_search etc). Default 0 (off).
allow=0
; Comma-separated host allow-list; empty = no restriction. .domain matches suffix.
allow_hosts=
; Max response body bytes per call (default 262144, max 8388608)
max_bytes=262144
; web_search primary URL template; %s is replaced with the URL-encoded query.
; If it fails, built-in engines are tried in order: Bing, Bing-CN, Baidu, DuckDuckGo.
search_url=https://html.duckduckgo.com/html/?q=%s
; GitHub token needed by gist_upload (gist scope)
github_token=
